<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CHANGE 1 of 4: the title shown in the browser tab.
       Keep the " · My Experience" part at the end. -->
  <title>Your Post Title · My Experience</title>

  <!-- CHANGE 2 of 4: one sentence about the post, between the quotation marks.
       Search engines show this under your title. -->
  <meta name="description" content="One sentence about this post.">

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="site-header">
    <a class="site-title" href="../index.html">My Experience</a>
    <nav class="site-nav">
      <a href="../index.html">Home</a>
      <a href="../about.html">About</a>
    </nav>
  </header>

  <main>
    <article>

      <p class="back-link"><a href="../index.html">← All posts</a></p>

      <div class="post-header">
        <!-- CHANGE 3 of 4: the date, the topic, and the title of the post.
             Topics: General Thoughts, Cooking and Food, Philosophy,
             Stories, Questionnaires. -->
        <p class="post-meta">Month 1, 2026 · Topic</p>
        <h1>Your Post Title</h1>
      </div>

      <!-- CHANGE 4 of 4: your writing. Each paragraph goes between
           <p> and </p>. Add as many paragraphs as you like. -->

      <p>Your first paragraph goes here.</p>

      <p>Your second paragraph goes here.</p>

      <!-- BUILDING BLOCKS
           Copy any line below, paste it into your post above this note,
           and change the words.

           A paragraph:
             <p>Your words.</p>

           A smaller heading:
             <h2>Your heading</h2>

           A quote:
             <blockquote><p>The quote.</p><p class="quote-by">Who said it</p></blockquote>

           A list with dots:
             <ul>
               <li>First thing</li>
               <li>Second thing</li>
             </ul>

           A list with numbers:
             <ol>
               <li>First step</li>
               <li>Second step</li>
             </ol>

           A questionnaire question and its answer:
             <p class="question">The question?</p>
             <p>The answer.</p>

           A photo (upload the photo into the posts folder first):
             <img src="name-of-photo.jpg" alt="A few words describing the photo">

           A link to another website:
             <a href="https://example.com">the words to click</a>

           Slanted words and bold words:
             <em>slanted</em>   <strong>bold</strong>

           A thin dividing line:
             <hr>
      -->

    </article>
  </main>

  <footer class="site-footer">
    <p>My Experience · Thank you for reading.</p>
  </footer>

</body>
</html>
